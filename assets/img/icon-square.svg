<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="SIDRA STUDIO">
  <title>SIDRA STUDIO — アイコン</title>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#05202F"/>
      <stop offset="0.55" stop-color="#0B3B57"/>
      <stop offset="1" stop-color="#136A8C"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.28" r="0.45">
      <stop offset="0" stop-color="#F0C86A" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#F0C86A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sea)"/>
  <rect width="1024" height="1024" fill="url(#sun)"/>
  <!-- いるか座＝導きの星 -->
  <circle cx="512" cy="316" r="34" fill="#F0C86A"/>
  <circle cx="672" cy="212" r="9" fill="#EAF6FA" opacity="0.7"/>
  <circle cx="356" cy="250" r="7" fill="#EAF6FA" opacity="0.55"/>
