<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OG image source — SALACIA STUDIO</title>
<!--
  OG画像（1200×630）の元データ。
  下記コマンドで assets/img/og-image.png を再生成できます。
    npx playwright screenshot --viewport-size=1200,630 tools/og-image.html assets/img/og-image.png
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    display: grid;
    place-items: center;
    background: linear-gradient(168deg, #05202f 0%, #0b3b57 55%, #0f4c6d 100%);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    color: #eaf6fa;
  }
  .glow {
    position: absolute;
    top: -180px; right: -120px;
    width: 620px; height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(240,200,106,.22) 0%, rgba(240,200,106,0) 66%);
  }
  .waves { position: absolute; left: 0; right: 0; bottom: -1px; height: 240px; }
  .waves svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  .w1 { fill: rgba(53,176,201,.16); }
  .w2 { fill: rgba(28,127,160,.30); }
  .w3 { fill: rgba(5,32,47,.55); }
  .inner { position: relative; text-align: center; }
  .letters {
    position: relative;
    display: block;
    padding-bottom: .86em;
    font-family: "Jost", sans-serif;
    font-weight: 200;
    font-size: 96px;
    line-height: 1;
    letter-spacing: .34em;
    text-indent: .34em;
    color: #fff;
  }
  .star {
    position: absolute;
    left: 50%; bottom: calc(100% + .03em);
    transform: translateX(-50%);
    width: .2em; height: .2em;
    border-radius: 50%;
    background: #f0c86a;
    box-shadow: 0 0 .5em rgba(240,200,106,.55);
  }
  .i { position: relative; }
  .logowave {
    position: absolute; left: 0; right: 0; bottom: .18em;
    height: .5em;
    fill: none; stroke: #35b0c9; stroke-width: 2.4; stroke-linecap: round;
  }
  .sub {
    display: block;
    margin-top: .1em;
    font-family: "Jost", sans-serif;
    font-weight: 300;
    font-size: 48px;
    line-height: 1;
    letter-spacing: .52em;
    text-indent: .52em;
    color: #f0c86a;
  }
  .tagline {
    margin-top: 56px;
    font-size: 26px;
    letter-spacing: .18em;
    color: rgba(234,246,250,.86);
  }
  .en {
    margin-top: 18px;
    font-family: "Jost", sans-serif;
    font-size: 15px;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: #f0c86a;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="waves">
    <svg class="w1" viewBox="0 0 1440 240" preserveAspectRatio="none"><path d="M0,100 C 90,72 270,72 360,100 C 450,128 630,128 720,100 C 810,72 990,72 1080,100 C 1170,128 1350,128 1440,100 L1440,240 L0,240 Z"/></svg>
    <svg class="w2" viewBox="0 0 1440 240" preserveAspectRatio="none"><path transform="translate(-210 46)" d="M0,100 C 90,72 270,72 360,100 C 450,128 630,128 720,100 C 810,72 990,72 1080,100 C 1170,128 1350,128 1440,100 C 1530,72 1710,72 1800,100 L1800,240 L0,240 Z"/></svg>
    <svg class="w3" viewBox="0 0 1440 240" preserveAspectRatio="none"><path transform="translate(-420 96)" d="M0,100 C 90,72 270,72 360,100 C 450,128 630,128 720,100 C 810,72 990,72 1080,100 C 1170,128 1350,128 1440,100 C 1530,72 1710,72 1800,100 C 1890,128 2070,128 2160,100 L2160,240 L0,240 Z"/></svg>
  </div>

  <div class="inner">
    <span class="letters">SALAC<span class="i">I<span class="star"></span></span>A<svg class="logowave" viewBox="0 0 200 14" preserveAspectRatio="none"><path d="M3 7.5 C 26 4.6, 48 7.4, 66 8.9 C 84 10.4, 100 7.2, 118 6 C 136 4.8, 152 7.6, 170 8.2 C 181 8.5, 190 7.2, 197 6.2"/></svg></span>
    <span class="sub">STUDIO</span>
    <p class="tagline">静かに輝く海から、物語をつくる。</p>
    <p class="en">Game Development Studio</p>
  </div>
</body>
</html>
